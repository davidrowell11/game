name: Build installers

# Builds the Windows installer (.exe) and macOS disk image (.dmg) on every push
# to main. Pushing a tag like v1.0.0 also publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            name: windows
          - os: macos-latest
            script: dist:mac
            name: macos
          - os: ubuntu-latest
            script: dist:linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          # Builds are unsigned; don't try to find a signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Depthwarden-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
      - name: Verify the macOS app is signed and universal
        if: matrix.name == 'macos'
        run: |
          APP=$(ls -d release/mac-universal/*.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Depthwarden"

  release:
    # Publishes a GitHub Release named after the version in package.json
    # (e.g. v1.0.0). Pushing to main again updates that release's files;
    # bump "version" in package.json to publish a new release.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Depthwarden ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          overwrite_files: true
          make_latest: true
          body: |
            **Download the file for your computer:**

            | Computer | File |
            | --- | --- |
            | Windows 10/11 | `Depthwarden-Setup.exe` |
            | Mac (Apple Silicon or Intel) | `Depthwarden-mac.dmg` |
            | Linux | `Depthwarden-linux.AppImage` |

            Step-by-step install instructions (including the first-launch security prompts) are in the [README](https://github.com/davidrowell11/game#install).
